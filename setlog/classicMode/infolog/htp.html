<!DOCTYPE html>
<html>
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="style.css" rel="stylesheet" type="text/css" />
        <style>
            /* CSS */
            body {
                background-image: url(/guesswho/images/backg.png);
                background-position: left top;
                background-repeat: repeat;
            }

            .title {
                color: #e37f2d;
                padding: 10px;
                font-family: "Brush Script MT", "Courier New", monospace;
                background-color: #b6e3c2;
                text-align: right;
                text-shadow: 5px 5px black;
                font-size: 100px;
            }

            .alphasim1 {
                font-family: "Lucida Console", "Courier New", monospace;
                color: #595959ff;
                position: absolute;
                top: 300px;
                left: 350px;
                font-size: 50px;
                font-weight: bold;
            }

            .sim1 {
                font-family: "Lucida Console", "Courier New", monospace;
                color: #595959ff;
                position: absolute;
                top: 380px;
                left: 350px;
                font-size: 20px;
                max-width: 70%;
                overflow-wrap: break-word;
                word-wrap: break-word;
            }

            .alphasim2 {
                font-family: "Lucida Console", "Courier New", monospace;
                color: #595959ff;
                position: absolute;
                top: 600px;
                left: 350px;
                font-size: 50px;
                font-weight: bold;
            }

            .sim2 {
                font-family: "Lucida Console", "Courier New", monospace;
                color: #595959ff;
                position: absolute;
                top: 680px;
                left: 350px;
                font-size: 20px;
                max-width: 70%;
                overflow-wrap: break-word;
                word-wrap: break-word;
            }



            .ik {
                width: 180px;
                height: 180px;
                display: block;
                margin-left: auto;
                margin-right: auto;
                position: absolute;
                top: 80px;
                left: 100px;
                cursor: pointer;
            }

            .ii {
                width: 200px;
                height: 200px;
                position: absolute;
                top: 280px;
                left: 120px;
                display: block;
                margin-left: auto;
                margin-right: auto;
                border-radius: 40px;
            }

            .ih {
                width: 200px;
                height: 200px;
                position: absolute;
                top: 580px;
                left: 120px;
                display: block;
                margin-left: auto;
                margin-right: auto;
                border-radius: 40px;
            }





        </style>

        <title>Info Page</title>
    </head>
    <body>
        <!-- HTML -->

        <p class="title">How To Play</p>

        <a href="/guesswho/setlog/classicMode/infolog/info.html">
            <img src="/guesswho/images/special/info.png" class="ik">
        </a>


        <p class="alphasim1">Identifier</p>

        <img src="/guesswho/images/special/placeholder.png" class="ii">

            <p class="sim1">Once a player has put in a identifier, without showing to the other player ask questions of what their identifier might be.</p>

        <p class="alphasim2">Points</p>

        <img src="/guesswho/images/special/crown.png" class="ih">

            <p class="sim2">Add or remove scoreboards based on how many players their are. Everytime a player wins 5 points get added to their score.</p>





        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <!-- <script src="script.js"></script> -->
        <script>
            // JS



        </script>
    </body>
</html>
